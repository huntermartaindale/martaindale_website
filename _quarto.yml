project:
  type: website
  output-dir: _site
  render:
    - "index.qmd"
    - "research.qmd"
    - "grants.qmd"
    - "cv.qmd"
    - "contact.qmd"
  resources:
    - CNAME
    - cv/
    - pubs/
    - robots.txt

website:
  title: "Hunter Martaindale"
  site-url: https://huntermartaindale.com
  description: "Director of Research, ALERRT Center | Texas State University"
  image: img/martaindale_headshot_2.png
  open-graph: true
  twitter-card: true
  favicon: img/favicon.ico
  navbar:
    background: light
    pinned: false
    collapse-below: lg
    left:
      - text: "Research"
        href: research.qmd
      - text: "Grants"
        href: grants.qmd
      - text: "CV"
        href: cv.qmd
      - text: "Contact"
        href: contact.qmd
    right:
      - text: "<i class='ai ai-google-scholar' style='font-size:1.1rem;'></i>"
        href: https://scholar.google.com/citations?user=_7PlqKYAAAAJ
        aria-label: Google Scholar
      - text: "<i class='ai ai-orcid' style='font-size:1.1rem;'></i>"
        href: https://orcid.org/0000-0002-8100-7698
        aria-label: ORCID
      - icon: github
        href: https://github.com/huntermartaindale
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/hmartaindale/
        aria-label: LinkedIn
  page-footer:
    center: "2026 | Hunter Martaindale"

format:
  html:
    theme: [cosmo, brand, styles.scss]
    toc: false
    link-external-newwindow: true
    link-external-icon: false
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.9.6/css/academicons.min.css" integrity="sha512-TNfdJEUUJmfj2DRlAKXBg7HroqoXYLon5XPEEWYa2+H/XSD2HAr0BwkRrAoNLAEz79x7XURTFRWDn9yhMNbbNQ==" crossorigin="anonymous" referrerpolicy="no-referrer">

execute:
  freeze: auto
  echo: false
  warning: false
  message: false
