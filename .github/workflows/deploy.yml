# Build huntermartaindale.com (Quarto + R) and deploy to GitHub Pages.
#
# Pulls the private CV from huntermartaindale/cv via a read-only deploy key
# (secret: CV_DEPLOY_KEY) and renders it into _site/cv/ before publishing.
#
# DNS for huntermartaindale.com (one-time, at registrar):
#   A     @   185.199.108.153
#   A     @   185.199.109.153
#   A     @   185.199.110.153
#   A     @   185.199.111.153
#   CNAME www huntermartaindale.github.io.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'      # Mondays 7am UTC: refresh Scholar stats
  workflow_dispatch:           # Manual trigger from Actions UI
  repository_dispatch:         # Fired by huntermartaindale/cv on push to its main
    types: [cv-updated]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write

    steps:
      - name: Check out website repository
        uses: actions/checkout@v5

      - name: Check out private CV repository
        uses: actions/checkout@v5
        with:
          repository: huntermartaindale/cv
          ssh-key: ${{ secrets.CV_DEPLOY_KEY }}
          path: cv-source

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install TinyTeX (for CV PDF rendering)
        uses: r-lib/actions/setup-tinytex@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        run: install.packages(c("scholar", "yaml", "htmltools", "dplyr", "purrr", "stringr", "knitr", "rmarkdown", "jsonlite"))
        shell: Rscript {0}

      - name: Refresh Google Scholar stats (website)
        run: Rscript data/update_scholar.R

      - name: Commit updated Scholar stats if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scholar_stats.yaml
          git diff --staged --quiet || git commit -m "chore: update scholar stats [skip ci]"
          git push || true

      - name: Render CV (HTML + PDF)
        working-directory: cv-source
        run: quarto render

      - name: Sync publications from cv_data.yaml
        run: Rscript scripts/sync_publications.R cv-source/cv_data.yaml

      - name: Sync grants from cv_data.yaml
        run: Rscript scripts/sync_grants.R cv-source/cv_data.yaml

      - name: Commit regenerated publications & grants if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/publications.yaml data/grants.yaml data/grants_summary.yaml
          git diff --staged --quiet || git commit -m "chore: sync publications & grants from CV [skip ci]"
          git push || true

      - name: Copy paper PDFs from CV repo
        run: |
          mkdir -p pubs
          cp -f cv-source/pubs/*.pdf pubs/ 2>/dev/null || true
          echo "PDFs copied into pubs/: $(ls pubs/*.pdf 2>/dev/null | wc -l)"

      - name: Render website
        run: quarto render

      - name: Place CV outputs into site
        run: |
          mkdir -p _site/cv
          cp cv-source/cv.html _site/cv/index.html
          cp cv-source/cv.pdf  _site/cv/martaindale_cv.pdf

      - name: Embed CV body into website CV page
        run: python3 scripts/embed_cv.py

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          cname: huntermartaindale.com

      # The gh-pages push above only queues GitHub's internal Pages build, and
      # that build can fail transiently ("Deployment failed, try again later")
      # with no retry, leaving the live site stale while this workflow stays
      # green (happened 2026-07-06). Wait until Pages has published the exact
      # commit just pushed, retrigger the build if it errors, and fail the run
      # only if three attempts can't get it published.
      - name: Verify Pages published the new gh-pages commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          expected=$(git ls-remote origin gh-pages | cut -f1)
          echo "Expecting Pages to publish gh-pages commit $expected"
          for attempt in 1 2 3; do
            for i in $(seq 1 30); do
              read -r status commit <<< "$(gh api "repos/${{ github.repository }}/pages/builds/latest" --jq '"\(.status) \(.commit)"' || echo "unknown unknown")"
              echo "Pages build status: $status (commit $commit)"
              if [ "$status" = "built" ] && [ "$commit" = "$expected" ]; then
                echo "Pages published the new build."
                echo "Pages published gh-pages commit \`$commit\`." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              [ "$status" = "errored" ] && break
              sleep 10
            done
            echo "Pages has not published $expected yet; retriggering build (attempt $attempt of 3)."
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
            sleep 15
          done
          echo "::error::GitHub Pages did not publish gh-pages commit $expected after 3 attempts; the live site is stale. Retrigger manually with: gh api repos/${{ github.repository }}/pages/builds -X POST"
          exit 1

      # Runs last and with always() so the site always deploys first. Fails the
      # run (red X -> GitHub emails the cron owner) when the cached Scholar stats
      # have gone stale, which is the signal that Scholar is blocking the runner
      # IP and the silent-preserve path in update_scholar.R has kicked in.
      - name: Fail loudly if Scholar stats are stale
        if: always()
        run: |
          STALE_AFTER_DAYS=8
          last=$(grep '^last_updated:' data/scholar_stats.yaml | sed "s/.*'\(.*\)'.*/\1/")
          age=$(( ( $(date +%s) - $(date -d "$last" +%s) ) / 86400 ))
          echo "Scholar stats last updated $last ($age days ago)."
          echo "Scholar stats last updated **$last** ($age days ago)." >> "$GITHUB_STEP_SUMMARY"
          if [ "$age" -gt "$STALE_AFTER_DAYS" ]; then
            echo "::error::Google Scholar stats are $age days old (> $STALE_AFTER_DAYS). The weekly CI fetch is being blocked by Scholar. Refresh locally with 'Rscript data/update_scholar.R' and commit data/scholar_stats.yaml."
            exit 1
          fi
