meta:
  name: Hunter Martaindale
  link: https://huntermartaindale.com

# Tokens mirror the palette at the top of styles.scss. Fonts are loaded by the
# <link> in _quarto.yml (so the Newsreader optical-size axis is available).
color:
  palette:
    ink: "#11151b"
    ink-soft: "#1b212a"
    paper: "#f4f2ec"
    paper-raised: "#fbfaf7"
    oxblood: "#8f2231"
    oxblood-deep: "#6f1825"
    brass: "#c9a45c"
    text: "#1d2229"
    steel: "#57616b"
    line: "#d8d4c9"
  primary: oxblood
  secondary: steel
  danger: "#b3261e"
  foreground: text
  background: paper
  link: oxblood

typography:
  base:
    family: IBM Plex Sans
    size: 1rem
    line-height: 1.65
  headings:
    family: Newsreader
    weight: 500
    line-height: 1.15
  monospace:
    family: IBM Plex Mono
  link:
    color: oxblood
    decoration: underline
